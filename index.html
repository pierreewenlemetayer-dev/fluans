<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluañs – améliorer sa vitesse de lecture</title>
<style>
:root{
  --blue:#244f73;
  --blue-dark:#183b58;
  --blue-light:#eef5f9;
  --border:#c9d8e3;
  --text:#24313b;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  color:var(--text);
  background:#f7f9fb;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
header{text-align:center;padding:42px 20px 28px}
h1{margin:0;color:var(--blue);font-family:Georgia, "Times New Roman", serif;font-size:clamp(3rem,7vw,5rem);font-weight:700;letter-spacing:-.04em;line-height:1}
.subtitle{margin:12px 0 0;color:#5b6b77;font-family:Georgia, "Times New Roman", serif;font-size:clamp(1.1rem,2.5vw,1.4rem);font-style:italic}
main{width:min(1050px,94%);margin:0 auto;padding:18px 0 30px;flex:1}
.controls{
  display:flex;justify-content:center;align-items:flex-end;gap:22px;flex-wrap:wrap;
  margin-bottom:20px;
}
.control-group{display:flex;flex-direction:column;gap:6px}
.control-group label{font-size:.88rem;color:#50616d}
button,select,input{
  font:inherit;border:1px solid var(--border);border-radius:7px;
  background:white;color:var(--text);padding:9px 12px;
}
button{cursor:pointer}
button:hover{background:var(--blue-light)}
button.active{background:var(--blue);color:white;border-color:var(--blue)}
input[type=number]{width:88px}
input:disabled,select:disabled,button:disabled{opacity:.5;cursor:default}
.stage{
  display:grid;grid-template-columns:minmax(0,1fr) 155px;gap:18px;align-items:stretch;
}
.display{
  min-height:250px;background:white;border:1px solid var(--border);border-radius:12px;
  display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;
  box-shadow:0 3px 12px rgba(30,60,80,.07);
}
#message{font-size:2.25rem;line-height:1.35;max-width:100%;white-space:pre-line}
.level-1{color:#b0d2ba}
.level-2{color:#cbb096}
.level-3{color:#e1aaaa}
.message-blue{color:var(--blue)}
.side{
  background:var(--blue-light);border:1px solid var(--border);border-radius:12px;
  padding:18px 15px;display:flex;flex-direction:column;gap:16px;
}
.side h2{font-size:1rem;color:var(--blue);margin:0}
.side .field{display:flex;flex-direction:column;gap:7px}
.side label{font-size:.82rem}
.timer-value{font-size:1.65rem;font-weight:bold;text-align:center;color:var(--blue)}
.mode-buttons{display:flex;flex-direction:column;gap:8px}.mode-btn{padding:9px 10px;border:1px solid var(--blue);border-radius:8px;background:white;color:var(--blue);font-weight:600}.mode-btn.active{background:var(--blue);color:white}.manual-label{display:flex;gap:8px;align-items:center;font-size:.85rem}
#action{
  display:block;margin:22px auto 0;min-width:150px;
  background:var(--blue);color:white;border-color:var(--blue);font-weight:bold;
}
#action:hover{background:var(--blue-dark)}
#action.secondary{background:white;color:var(--blue)}
.status{text-align:center;min-height:28px;margin:14px 0 0;color:#5a6974;font-size:.92rem}
footer{text-align:center;padding:18px;color:#687681;font-size:.8rem}
@media(max-width:700px){
  .stage{grid-template-columns:1fr}
  .side{display:grid;grid-template-columns:1fr 1fr;align-items:center}
  .side h2{grid-column:1/-1}
  #message{font-size:1.65rem}
}
</style>
</head>
<body>
<header>
  <h1>Fluañs</h1>
  <p class="subtitle">Améliorer sa vitesse de lecture</p>
</header>

<main>
  <div class="controls">
    <div class="control-group">
      <label>Choisir une série</label>
      <div>
        <button id="randomBtn" type="button" class="active">Au hasard</button>
        <span style="margin-left:8px;">Par numéro</span>
        <input id="numberInput" type="number" min="1" max="30" placeholder="1" aria-label="Numéro de série">
      </div>
    </div>
    <div class="control-group">
      <label>Niveau de difficulté</label>
      <select id="difficulty">
        <option value="random">—</option>
        <option value="1">1 – Facile</option>
        <option value="2">2 – Intermédiaire</option>
        <option value="3">3 – Difficile</option>
      </select>
    </div>
  </div>

  <div class="stage">
    <section class="display" aria-live="polite">
      <div id="message"></div>
    </section>

    <aside class="side">
      <div class="mode-buttons">
        <button id="manualMode" type="button" class="mode-btn active">Mode manuel</button>
        <button id="timerMode" type="button" class="mode-btn">Timer</button>
      </div>
      <div class="field" id="timerSettings" style="display:none">
        <label for="duration">Durée</label>
        <input id="duration" type="range" min="1" max="5" value="3">
        <div class="timer-value"><span id="durationValue">3</span> s</div>
      </div>
    </aside>
  </div>

  <button id="action" type="button">Démarrer</button>
  <div id="status" class="status"></div>
</main>

<footer>© Fluañs – Pierre Lemétayer – 2026</footer>

<script src="series.js"></script>
<script>
const message=document.getElementById("message");
const action=document.getElementById("action");
const status=document.getElementById("status");
const randomBtn=document.getElementById("randomBtn");
const numberInput=document.getElementById("numberInput");
const difficulty=document.getElementById("difficulty");
const duration=document.getElementById("duration");
const durationValue=document.getElementById("durationValue");
const timerMode=document.getElementById("timerMode");
const manualMode=document.getElementById("manualMode");
const timerSettings=document.getElementById("timerSettings");

let current=null, phase="ready", index=0, timerId=null, countdownId=null, chronoStart=0, chronoId=null;
let displayMode="manual";

duration.addEventListener("input",()=>durationValue.textContent=duration.value);

randomBtn.onclick=()=>{
  numberInput.value="";
  difficulty.value="random";
  reset();
};

numberInput.oninput=()=>{
  if(numberInput.value!==""){
    difficulty.value="random";
    reset();
  }
};

difficulty.onchange=()=>reset();

timerMode.onclick=()=>{
  displayMode="timer";
  timerMode.classList.add("active");
  manualMode.classList.remove("active");
  timerSettings.style.display="";
  reset();
};

manualMode.onclick=()=>{
  displayMode="manual";
  manualMode.classList.add("active");
  timerMode.classList.remove("active");
  timerSettings.style.display="none";
  reset();
};

duration.onchange=reset;

function clearTimers(){
  if(timerId!==null){clearTimeout(timerId);timerId=null}
  if(countdownId!==null){clearInterval(countdownId);countdownId=null}
  if(chronoId!==null){clearInterval(chronoId);chronoId=null}
}

function reset(){
  clearTimers();
  current=null; phase="ready"; index=0;
  message.style.fontSize="";
  message.className="";
  message.innerHTML="";
  status.textContent="";
  action.textContent="Démarrer";
  action.classList.remove("secondary");
}

function chooseSeries(){
  const n=Number(numberInput.value);
  if(n>=1 && n<=30) return SERIES[n-1];

  if(difficulty.value!=="random"){
    const level=Number(difficulty.value);
    const pool=SERIES.filter(s=>s.level===level);
    return pool[Math.floor(Math.random()*pool.length)];
  }

  return SERIES[Math.floor(Math.random()*SERIES.length)];
}

function setText(text,level=null){
  message.className=level ? "level-"+level : "";
  message.textContent=text;
}
function seriesStatus(extra=""){
  if(!current) return extra;
  return "Série "+current.id+" · niveau "+current.level+(extra ? " · "+extra : "");
}

function startSeries(){
  current=chooseSeries();
  index=0;
  phase="waiting-first";
  status.textContent="Série "+current.id+" · niveau "+current.level;
  action.textContent="Démarrer";
  setText("Prêt·e·s ?\nConcentré·e·s ?\nC’est parti.");
  message.className="message-blue";
}

function startNextPhrase(){
  if(index<5){
    phase="phrase";
    setText(current.phrases[index],current.level);
    runDisplay();
  } else {
    phase="bonus-intro";
    setText("Bonus !");
    message.className="message-blue";
    message.style.fontSize="1.7rem";
    const hint=document.createElement("span");
    hint.style.cssText="display:block;font-size:.85rem;color:#a2a2a2;margin-top:8px;font-weight:400;";
    hint.textContent="Remettez les lettres manquantes";
    message.textContent="Bonus !";
    message.appendChild(hint);
    action.textContent="Démarrer";
    status.textContent=seriesStatus("Les cinq phrases sont terminées.");
  }
}

function runDisplay(){
  clearTimers();
  action.textContent="Arrêter";

  if(displayMode==="manual"){
    chronoStart=Date.now();
    status.textContent=seriesStatus("Visible depuis 0,0 s");
    chronoId=setInterval(()=>{
      const seconds=((Date.now()-chronoStart)/1000).toFixed(1).replace(".",",");
      status.textContent=seriesStatus("Visible depuis "+seconds+" s");
    },100);
  } else {
    let remaining=Number(duration.value);
    status.textContent=seriesStatus("Visible · "+remaining+" s");
    countdownId=setInterval(()=>{
      remaining--;
      if(remaining>0) status.textContent=seriesStatus("Visible · "+remaining+" s");
    },1000);
    timerId=setTimeout(()=>finishDisplay(),Number(duration.value)*1000);
  }
}

function finishDisplay(){
  clearTimers();

  if(phase==="phrase"){
    index++;
    phase="waiting-next";
    setText("Écrivez");
    message.className="message-blue";
    action.textContent="Démarrer";
    status.textContent=seriesStatus(index<5 ? "Phrase "+index+" / 5 terminée." : "Les cinq phrases sont terminées.");
    return;
  }

  if(phase==="bonus"){
    phase="correction";
    index=0;
    setText("Correction");
    action.textContent="Correction";
    action.classList.add("secondary");
    status.textContent=seriesStatus("Cliquez pour révéler les phrases dans l’ordre.");
  }
}

function showBonus(){
  phase="bonus";
  setText(current.bonus.reduced,current.level);
  runDisplay();
}

function showCorrection(){
  if(index<5){
    setText(current.phrases[index],current.level);
    status.textContent=seriesStatus("Correction · phrase "+(index+1)+" / 5");
    index++;
    return;
  }
  if(index===5){
    setText(current.bonus.reduced,current.level);
    status.textContent=seriesStatus("Correction · bonus réduit");
    index++;
    return;
  }
  if(index===6){
    setText(current.bonus.full,current.level);
    status.textContent=seriesStatus("Correction · bonus complet");
    index++;
    return;
  }

  const all=current.phrases.map((p,i)=>(i+1)+". "+p).join("\n")+"\n\nBonus : "+current.bonus.full;
  setText(all,current.level);
  message.style.fontSize="1.15rem";
  status.textContent=seriesStatus("Série terminée.");
  action.textContent="Recommencer";
  action.classList.remove("secondary");
  phase="done";
}

action.onclick=()=>{
  if(phase==="ready"){
    startSeries();
    return;
  }
  if(phase==="waiting-first" || phase==="waiting-next"){
    startNextPhrase();
    return;
  }
  if(phase==="phrase" || phase==="bonus"){
    finishDisplay();
    return;
  }
  if(phase==="bonus-intro"){
    showBonus();
    return;
  }
  if(phase==="correction"){
    showCorrection();
    return;
  }
  if(phase==="done"){
    reset();
  }
};
</script>
</body>
</html>
